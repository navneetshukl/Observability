services:
  postgres:
    image: postgres:16-alpine
    container_name: postgres
    environment:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: postgres
      POSTGRES_DB: orderly
    ports:
      - "5433:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U postgres -d orderly"]
      interval: 5s
      timeout: 5s
      retries: 5
    restart: unless-stopped

  # orderly:
  #   build:
  #     context: .
  #     dockerfile: Dockerfile
  #   container_name: orderly
  #   ports:
  #     - "8080:8080"
  #   environment:
  #     DATABASE_URL: postgres://postgres:postgres@postgres:5432/orderly?sslmode=disable
  #     # SLOW_DB: "true"  # Uncomment to enable slow database mode for failure experiment
  #   depends_on:
  #     postgres:
  #       condition: service_healthy
  #   restart: unless-stopped

  prometheus:
    image: prom/prometheus:v2.54.0
    container_name: prometheus
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus_data:/prometheus
    command:
      - '--config.file=/etc/prometheus/prometheus.yml'
      - '--storage.tsdb.path=/prometheus'
      - '--storage.tsdb.retention.time=15d'
      - '--web.enable-lifecycle'
    restart: unless-stopped

volumes:
  postgres_data:
  prometheus_data: